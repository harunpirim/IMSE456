name: Publish course site

on:
  push:
    branches: [main]
  schedule:
    # 11:00 UTC = 06:00 America/Chicago (CDT) / 05:00 (CST after 1 November).
    # Cron is UTC and does not follow daylight saving.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: pip install -r scripts/requirements.txt

      - name: Apply release gating
        run: python scripts/gate.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      - name: Render site
        run: quarto render _build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/_site
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish site (gated as of build date)"
