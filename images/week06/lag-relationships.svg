<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 550" role="img" aria-labelledby="title desc" style="width:100%;height:550px;font-family:Arial,sans-serif">
<title id="title">Finish-to-start, start-to-start and finish-to-finish lags</title><desc id="desc">Three timelines show the activity endpoints constrained by a positive two-day lag. The successor may start or finish later if another constraint controls.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1090" height="550" fill="#fff"/><text x="25" y="35" font-size="24" fill="#0F5A4B" font-weight="700" text-anchor="start">Each relationship constrains a specific start or finish</text><text x="25" y="107" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">FS + 2</text><text x="25" y="177" font-size="19" fill="#627571" font-weight="400" text-anchor="start">Successor starts ≥ predecessor finish + 2</text><rect x="230" y="78" width="288" height="27" rx="2" fill="#0F5A4B" stroke="none" stroke-width="2"/><rect x="614" y="125" width="192" height="27" rx="2" fill="#83ADA0" stroke="none" stroke-width="2"/><text x="875" y="99" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Predecessor</text><text x="875" y="146" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Successor</text><path d="M518,107 V114 H614 V124" fill="none" stroke="#627571" stroke-width="2" marker-end="url(#gray)"/><text x="25" y="247" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">SS + 2</text><text x="25" y="317" font-size="19" fill="#627571" font-weight="400" text-anchor="start">Successor starts ≥ predecessor start + 2</text><rect x="230" y="218" width="288" height="27" rx="2" fill="#0F5A4B" stroke="none" stroke-width="2"/><rect x="326" y="265" width="384" height="27" rx="2" fill="#83ADA0" stroke="none" stroke-width="2"/><text x="875" y="239" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Predecessor</text><text x="875" y="286" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Successor</text><path d="M230,247 V254 H326 V264" fill="none" stroke="#627571" stroke-width="2" marker-end="url(#gray)"/><text x="25" y="387" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">FF + 2</text><text x="25" y="457" font-size="19" fill="#627571" font-weight="400" text-anchor="start">Successor finishes ≥ predecessor finish + 2</text><rect x="230" y="358" width="288" height="27" rx="2" fill="#0F5A4B" stroke="none" stroke-width="2"/><rect x="422" y="405" width="192" height="27" rx="2" fill="#83ADA0" stroke="none" stroke-width="2"/><text x="875" y="379" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Predecessor</text><text x="875" y="426" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Successor</text><path d="M518,387 V394 H614 V404" fill="none" stroke="#627571" stroke-width="2" marker-end="url(#gray)"/><text x="25" y="508" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="start">A lag is a minimum separation. Other dependencies can push the successor later.</text></svg>
