<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc" style="width:100%;height:450px;font-family:Arial,sans-serif">
<title id="title">Reading an activity node</title><desc id="desc">Node legend with ES duration EF above, LS total slack LF below; D has ES 7 EF 11 LS 12 LF 16 total slack 5 and free slack 5.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1100" height="450" fill="#fff"/><text x="38" y="45" font-size="24" fill="#0F5A4B" font-weight="700" text-anchor="start">Field positions</text><text x="588" y="45" font-size="24" fill="#0F5A4B" font-weight="700" text-anchor="start">Worked example: activity D</text><rect x="38" y="72" width="470" height="244" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M38,140 L508,140" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M38,248 L508,248" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M193,72 L193,140" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M353,72 L353,140" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M193,248 L193,316" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M353,248 L353,316" fill="none" stroke="#0F5A4B" stroke-width="2" /><text x="115" y="115" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">ES</text><text x="273" y="115" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">Duration</text><text x="430" y="115" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">EF</text><text x="115" y="291" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">LS</text><text x="273" y="291" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">Total slack</text><text x="430" y="291" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">LF</text><text x="273" y="188" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Activity ID and description</text><text x="273" y="225" font-size="20" fill="#627571" font-weight="400" text-anchor="middle">Free slack shown separately</text><rect x="588" y="72" width="470" height="244" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M588,140 L1058,140" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M588,248 L1058,248" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M743,72 L743,140" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M903,72 L903,140" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M743,248 L743,316" fill="none" stroke="#0F5A4B" stroke-width="2" /><path d="M903,248 L903,316" fill="none" stroke="#0F5A4B" stroke-width="2" /><text x="665" y="115" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">7</text><text x="823" y="115" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">4 days</text><text x="980" y="115" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">11</text><text x="665" y="291" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">12</text><text x="823" y="291" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">5 days</text><text x="980" y="291" font-size="23" fill="#203331" font-weight="600" text-anchor="middle">16</text><text x="823" y="188" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">D · Configure registration</text><text x="823" y="225" font-size="20" fill="#627571" font-weight="400" text-anchor="middle">Free slack = 16 − 11 = 5 days</text><text x="38" y="368" font-size="22" fill="#203331" font-weight="400" text-anchor="start">Early window: day 7 to 11</text><text x="588" y="368" font-size="22" fill="#203331" font-weight="400" text-anchor="start">Late window: day 12 to 16</text><text x="38" y="407" font-size="21" fill="#627571" font-weight="400" text-anchor="start">Moving D five days later uses its total slack; its four-day duration stays the same.</text></svg>
