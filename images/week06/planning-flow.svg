<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 300" role="img" aria-labelledby="title desc" style="width:100%;height:300px;font-family:Arial,sans-serif">
<title id="title">How work becomes a schedule</title><desc id="desc">A WBS defines work packages, activities add durations, a network adds logic, and the schedule calculates timing.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1090" height="300" fill="#fff"/><text x="25" y="47" font-size="18" fill="#627571" font-weight="700" text-anchor="start">01</text><rect x="25" y="70" width="220" height="138" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="43" y="108" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">WBS</text><text x="43" y="149" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Defined deliverables</text><text x="43" y="177" font-size="18" fill="#203331" font-weight="400" text-anchor="start">and work packages</text><path d="M250,137 H281" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><text x="290" y="47" font-size="18" fill="#627571" font-weight="700" text-anchor="start">02</text><rect x="290" y="70" width="220" height="138" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="308" y="108" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">Activities</text><text x="308" y="149" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Observable work</text><text x="308" y="177" font-size="18" fill="#203331" font-weight="400" text-anchor="start">and duration estimates</text><path d="M515,137 H546" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><text x="555" y="47" font-size="18" fill="#627571" font-weight="700" text-anchor="start">03</text><rect x="555" y="70" width="220" height="138" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="573" y="108" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">Network</text><text x="573" y="149" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Predecessors and</text><text x="573" y="177" font-size="18" fill="#203331" font-weight="400" text-anchor="start">permitted overlap</text><path d="M780,137 H811" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><text x="820" y="47" font-size="18" fill="#627571" font-weight="700" text-anchor="start">04</text><rect x="820" y="70" width="220" height="138" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="838" y="108" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">Schedule</text><text x="838" y="149" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Calculated timing</text><text x="838" y="177" font-size="18" fill="#203331" font-weight="400" text-anchor="start">and calendar dates</text><text x="25" y="261" font-size="20" fill="#627571" font-weight="400" text-anchor="start">Keep the WBS code, activity owner and definition of done connected across the four steps.</text></svg>
