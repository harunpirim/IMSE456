<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 415" role="img" aria-labelledby="title desc" style="width:100%;height:415px;font-family:Arial,sans-serif">
<title id="title">Why the forward pass uses max and the backward pass uses min</title><desc id="desc">The forward pass at G selects predecessor EF 16, not 11. The backward pass at C selects successor LS 8, not 14. Arrows show calculation direction.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1140" height="415" fill="#fff"/><text x="25" y="38" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="start">Forward pass: wait for every predecessor</text><text x="595" y="38" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="start">Backward pass: protect every successor</text><rect x="25" y="75" width="185" height="80" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="117" y="108" font-size="21" fill="#203331" font-weight="600" text-anchor="middle">D finishes 11</text><text x="117" y="139" font-size="19" fill="#627571" font-weight="400" text-anchor="middle">EF = 11</text><rect x="25" y="235" width="185" height="80" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="117" y="268" font-size="21" fill="#203331" font-weight="600" text-anchor="middle">E finishes 16</text><text x="117" y="299" font-size="19" fill="#627571" font-weight="400" text-anchor="middle">EF = 16</text><path d="M210,115 H265 V175 H320" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><path d="M210,275 H265 V225 H320" fill="none" stroke="#0F5A4B" stroke-width="5" marker-end="url(#green)"/><rect x="320" y="157" width="205" height="86" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="422" y="190" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">G starts 16</text><text x="422" y="224" font-size="21" fill="#203331" font-weight="400" text-anchor="middle">max(11, 16)</text><rect x="595" y="157" width="200" height="86" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="695" y="190" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="middle">C finishes by 8</text><text x="695" y="224" font-size="21" fill="#203331" font-weight="400" text-anchor="middle">min(8, 14)</text><rect x="920" y="75" width="190" height="80" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="1015" y="108" font-size="21" fill="#203331" font-weight="600" text-anchor="middle">E starts by 8</text><text x="1015" y="139" font-size="19" fill="#627571" font-weight="400" text-anchor="middle">LS = 8</text><rect x="920" y="235" width="190" height="80" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="1015" y="268" font-size="21" fill="#203331" font-weight="600" text-anchor="middle">F starts by 14</text><text x="1015" y="299" font-size="19" fill="#627571" font-weight="400" text-anchor="middle">LS = 14</text><path d="M920,115 H860 V175 H795" fill="none" stroke="#0F5A4B" stroke-width="5" marker-end="url(#green)"/><path d="M920,275 H860 V225 H795" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><text x="25" y="373" font-size="20" fill="#627571" font-weight="400" text-anchor="start">Choosing 11 would begin G before E is complete.</text><text x="595" y="373" font-size="20" fill="#627571" font-weight="400" text-anchor="start">Choosing 14 would make C too late for E.</text></svg>
