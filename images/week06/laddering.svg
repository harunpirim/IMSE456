<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 480" role="img" aria-labelledby="title desc" style="width:100%;height:480px;font-family:Arial,sans-serif">
<title id="title">Laddering for three pipeline segments</title><desc id="desc">Each crew moves from segment 1 to 2 to 3. Within each segment digging precedes laying pipe and laying pipe precedes refill. Different crews can overlap across segments.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1090" height="480" fill="#fff"/><text x="25" y="40" font-size="25" fill="#0F5A4B" font-weight="700" text-anchor="start">Three segments; one crew for each type of work</text><path d="M420,115 H500" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><path d="M310,147 V182" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><rect x="200" y="83" width="220" height="64" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="310" y="122" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Dig 1</text><path d="M730,115 H810" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><path d="M620,147 V182" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><rect x="510" y="83" width="220" height="64" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="620" y="122" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Dig 2</text><path d="M930,147 V182" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><rect x="820" y="83" width="220" height="64" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="930" y="122" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Dig 3</text><path d="M420,223 H500" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><path d="M310,255 V290" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><rect x="200" y="191" width="220" height="64" rx="8" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="310" y="230" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Lay pipe 1</text><path d="M730,223 H810" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><path d="M620,255 V290" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><rect x="510" y="191" width="220" height="64" rx="8" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="620" y="230" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Lay pipe 2</text><path d="M930,255 V290" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#green)"/><rect x="820" y="191" width="220" height="64" rx="8" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="930" y="230" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Lay pipe 3</text><path d="M420,331 H500" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><rect x="200" y="299" width="220" height="64" rx="8" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="310" y="338" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Refill 1</text><path d="M730,331 H810" fill="none" stroke="#627571" stroke-width="3" marker-end="url(#gray)"/><rect x="510" y="299" width="220" height="64" rx="8" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="620" y="338" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Refill 2</text><rect x="820" y="299" width="220" height="64" rx="8" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="930" y="338" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="middle">Refill 3</text><text x="25" y="122" font-size="20" fill="#203331" font-weight="600" text-anchor="start">Trench crew</text><text x="25" y="230" font-size="20" fill="#203331" font-weight="600" text-anchor="start">Pipe crew</text><text x="25" y="338" font-size="20" fill="#203331" font-weight="600" text-anchor="start">Refill crew</text><text x="25" y="447" font-size="21" fill="#627571" font-weight="400" text-anchor="start">Horizontal links preserve crew order. Vertical links preserve the handoff within each segment.</text></svg>
