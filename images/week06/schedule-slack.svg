1" /><path d="M847,84 L847,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><path d="M880,84 L880,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><text x="880" y="72" font-size="20" fill="#627571" font-weight="400" text-anchor="middle">20</text><path d="M913,84 L913,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><path d="M946,84 L946,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><path d="M979,84 L979,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><path d="M1012,84 L1012,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><path d="M1045,84 L1045,505" fill="none" stroke="#E0E7E4" stroke-width="1" /><text x="1045" y="72" font-size="20" fill="#627571" font-weight="400" text-anchor="middle">25</text><text x="25" y="119" font-size="18" fill="#203331" font-weight="600" text-anchor="start">A  Event brief</text><rect x="220" y="96" width="66" height="30" rx="3" fill="#0F5A4B" stroke="none" stroke-width="2"/><text x="25" y="163" font-size="18" fill="#203331" font-weight="600" text-anchor="start">B  Venue</text><rect x="286" y="140" width="165" height="30" rx="3" fill="#83ADA0" stroke="none" stroke-width="2"/><rect x="451" y="140" width="165" height="30" fill="#FFF4DE" stroke="#B97812" stroke-width="2" stroke-dasharray="6 4"/><text x="25" y="207" font-size="18" fill="#203331" font-weight="600" text-anchor="start">C  Program draft</text><rect x="286" y="184" width="198" height="30" rx="3" fill="#0F5A4B" stroke="none" stroke-width="2"/><text x="25" y="251" font-size="18" fill="#203331" font-weight="600" text-anchor="start">D  Registration</text><rect x="451" y="228" width="132" height="30" rx="3" fill="#83ADA0" stroke="none" stroke-width="2"/><rect x="583" y="228" width="165" height="30" fill="#FFF4DE" stroke="#B97812" stroke-width="2" stroke-dasharray="6 4"/><text x="25" y="295" font-size="18" fill="#203331" font-weight="600" text-anchor="start">E  Speakers</text><rect x="484" y="272" width="264" height="30" rx="3" fill="#0F5A4B" stroke="none" stroke-width="2"/><text x="25" y="339" font-size="18" fill="#203331" font-weight="600" text-anchor="start">F  Exhibitors</text><rect x="484" y="316" width="165" height="30" rx="3" fill="#83ADA0" stroke="none" stroke-width="2"/><rect x="649" y="316" width="198" height="30" fill="#FFF4DE" stroke="#B97812" stroke-width="2" stroke-dasharray="6 4"/><text x="25" y="383" font-size="18" fill="#203331" font-weight="600" text-anchor="start">G  Publish program</text><rect x="748" y="360" width="99" height="30" rx="3" fill="#0F5A4B" stroke="none" stroke-width="2"/><text x="25" y="427" font-size="18" fill="#203331" font-weight="600" text-anchor="start">H  Materials</text><rect x="847" y="404" width="132" height="30" rx="3" fill="#0F5A4B" stroke="none" stroke-width="2"/><text x="25" y="471" font-size="18" fill="#203331" font-weight="600" text-anchor="start">I  Rehearsal</text><rect x="979" y="448" width="66" height="30" rx="3" fill="#0F5A4B" stroke="none" stroke-width="2"/><rect x="25" y="530" width="32" height="20" rx="2" fill="#0F5A4B" stroke="none" stroke-width="2"/><text x="70" y="547" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Critical work</text><rect x="250" y="530" width="32" height="20" rx="2" fill="#83ADA0" stroke="none" stroke-width="2"/><text x="295" y="547" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Other work</text><rect x="470" y="530" width="32" height="20" rx="2" fill="#FFF4DE" stroke="#B97812" stroke-width="2"/><text x="515" y="547" font-size="18" fill="#203331" font-weight="400" text-anchor="start">Total slack (shared along a path)</text><text x="1038" y="547" font-size="18" fill="#627571" font-weight="400" text-anchor="end">Workdays</text><text x="25" y="593" font-size="20" fill="#0F5A4B" font-weight="700" text-anchor="start">B and D share five days of path slack. Their dashed allowances cannot be added together.</text></svg>
