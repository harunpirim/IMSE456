<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 625" role="img" aria-labelledby="title desc" style="width:100%;height:625px;font-family:Arial,sans-serif">
<title id="title">Time-scaled schedule with total slack</title><desc id="desc">Gantt chart from day 0 through day 25. B and D each show five days of total slack, shared along their branch; F has six days.</desc>
