<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc" style="width:100%;height:260px;font-family:Arial,sans-serif">
<title id="title">The procurement process</title><desc id="desc">Six steps: plan, solicit, select, contract, administer, close.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="260" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">The procurement process, from make-or-buy to closeout</text><path d="M22,70 L156,70 L172,100 L156,130 L22,130 L38,100 Z" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="101.0" y="106" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Plan</text><text x="97.0" y="162" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">make or buy; what,</text><text x="97.0" y="180" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">when, which contract</text><path d="M181,70 L315,70 L331,100 L315,130 L181,130 L197,100 Z" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="260.0" y="106" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Solicit</text><text x="256.0" y="162" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">issue the RFP;</text><text x="256.0" y="180" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">answer questions</text><path d="M340,70 L474,70 L490,100 L474,130 L340,130 L356,100 Z" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="419.0" y="106" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Select</text><text x="415.0" y="162" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">evaluate proposals against</text><text x="415.0" y="180" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">the criteria</text><path d="M499,70 L633,70 L649,100 L633,130 L499,130 L515,100 Z" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="578.0" y="106" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Contract</text><text x="574.0" y="162" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">negotiate and</text><text x="574.0" y="180" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">sign</text><path d="M658,70 L792,70 L808,100 L792,130 L658,130 L674,100 Z" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="737.0" y="106" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Administer</text><text x="733.0" y="162" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">monitor, pay,</text><text x="733.0" y="180" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">control changes</text><path d="M817,70 L951,70 L967,100 L951,130 L817,130 L833,100 Z" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="896.0" y="106" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Close</text><text x="892.0" y="162" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">accept, settle,</text><text x="892.0" y="180" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">record lessons</text><text x="25" y="232" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">The RFP drives solicitation; the contract's change-control clause drives administration.</text></svg>
