<title id="title">Buyer's payment under three contract types</title><desc id="desc">Lines of the buyer's total payment against actual cost: flat at 45,000 for fixed price, actual plus 4,000 for cost plus fixed fee, and a flatter line for cost plus incentive fee that crosses the fixed price at 41,250.</desc>
