<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" style="width:100%;height:400px;font-family:Arial,sans-serif">
<title id="title">The contract-type risk spectrum</title><desc id="desc">Five contract types from seller risk to buyer risk: firm fixed price, fixed price incentive, cost plus incentive fee, cost plus fixed fee, time and materials.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="400" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Who carries the cost risk depends on the type of contract</text><defs><linearGradient id="rk" x1="0" x2="1"><stop offset="0" stop-color="#E9F3EF"/><stop offset="1" stop-color="#F7ECE9"/></linearGradient></defs><rect x="80" y="150" width="840" height="34" rx="6" fill="url(#rk)" stroke="#627571" stroke-width="1.5"/><text x="80" y="136" font-size="15" fill="#0F5A4B" font-weight="700" text-anchor="start">Seller carries the risk</text><text x="920" y="136" font-size="15" fill="#B5543A" font-weight="700" text-anchor="end">Buyer carries the risk</text><circle cx="150.0" cy="167" r="9" fill="#203331" stroke="#fff" stroke-width="2"/><text x="150.0" y="222" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">FFP</text><text x="150.0" y="244" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Firm fixed price</text><circle cx="325.0" cy="167" r="9" fill="#203331" stroke="#fff" stroke-width="2"/><text x="325.0" y="222" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">FPIF</text><text x="325.0" y="244" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Fixed price + incentive</text><circle cx="500.0" cy="167" r="9" fill="#203331" stroke="#fff" stroke-width="2"/><text x="500.0" y="222" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">CPIF</text><text x="500.0" y="244" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Cost plus incentive fee</text><circle cx="675.0" cy="167" r="9" fill="#203331" stroke="#fff" stroke-width="2"/><text x="675.0" y="222" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">CPFF</text><text x="675.0" y="244" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Cost plus fixed fee</text><circle cx="850.0" cy="167" r="9" fill="#203331" stroke="#fff" stroke-width="2"/><text x="850.0" y="222" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">T&amp;M</text><text x="850.0" y="244" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Time and materials</text><text x="80" y="310" font-size="15" fill="#203331" font-weight="400" text-anchor="start">Fixed price fits a well-defined scope with predictable costs.</text><text x="80" y="334" font-size="15" fill="#203331" font-weight="400" text-anchor="start">Cost-plus fits work whose scope or cost cannot be known when the contract is signed.</text><text x="80" y="368" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Incentive clauses in the middle share overruns and savings between the two.</text></svg>
