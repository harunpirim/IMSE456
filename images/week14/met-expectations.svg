<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc" style="width:100%;height:380px;font-family:Arial,sans-serif">
<title id="title">The met-expectations model of customer satisfaction</title><desc id="desc">A scale of the ratio of perceived to expected performance: below 1 dissatisfied, about 1 satisfied, above 1 very satisfied, with a target near 1.05.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="380" fill="#fff"/><text x="25" y="36" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="start">Satisfaction depends on performance relative to what the customer expected</text><text x="500" y="92" font-size="19" fill="#203331" font-weight="700" text-anchor="middle">Satisfaction ratio  =  perceived performance ÷ expected performance</text><rect x="90" y="178" width="348.49999999999983" height="44" rx="0" fill="#F7ECE9" stroke="none" stroke-width="0"/><rect x="438.49999999999983" y="178" width="123.00000000000017" height="44" rx="0" fill="#F5F7F7" stroke="none" stroke-width="0"/><rect x="561.5" y="178" width="348.5" height="44" rx="0" fill="#E9F3EF" stroke="none" stroke-width="0"/><path d="M90,222 L910,222" fill="none" stroke="#203331" stroke-width="2"/><path d="M90.0,222 L90.0,230" fill="none" stroke="#203331" stroke-width="2"/><text x="90.0" y="252" font-size="15" fill="#627571" font-weight="400" text-anchor="middle">0.80</text><path d="M294.99999999999994,222 L294.99999999999994,230" fill="none" stroke="#203331" stroke-width="2"/><text x="294.99999999999994" y="252" font-size="15" fill="#627571" font-weight="400" text-anchor="middle">0.90</text><path d="M499.9999999999999,222 L499.9999999999999,230" fill="none" stroke="#203331" stroke-width="2"/><text x="499.9999999999999" y="252" font-size="15" fill="#627571" font-weight="400" text-anchor="middle">1.00</text><path d="M705.0000000000001,222 L705.0000000000001,230" fill="none" stroke="#203331" stroke-width="2"/><text x="705.0000000000001" y="252" font-size="15" fill="#627571" font-weight="400" text-anchor="middle">1.10</text><path d="M909.9999999999998,222 L909.9999999999998,230" fill="none" stroke="#203331" stroke-width="2"/><text x="909.9999999999998" y="252" font-size="15" fill="#627571" font-weight="400" text-anchor="middle">1.20</text><text x="264.2499999999999" y="206" font-size="16" fill="#B5543A" font-weight="700" text-anchor="middle">Dissatisfied: ratio below 1</text><text x="499.9999999999999" y="166" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Satisfied</text><text x="499.9999999999999" y="206" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">≈ 1</text><text x="735.75" y="206" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="middle">Very satisfied: ratio above 1</text><circle cx="602.5" cy="222" r="8" fill="#0F5A4B" stroke="#fff" stroke-width="2"/><path d="M602.5,270 L602.5,232" fill="none" stroke="#0F5A4B" stroke-width="1.8" marker-end="url(#g)"/><text x="602.5" y="290" font-size="15" fill="#0F5A4B" font-weight="700" text-anchor="middle">Aim here: about 1.05</text><text x="602.5" y="310" font-size="13" fill="#627571" font-weight="400" text-anchor="middle" font-style="italic">exceeding expectations by a lot costs money</text><text x="25" y="362" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Both the numerator and the denominator are perceptions, and the project manager can shape both.</text></svg>
