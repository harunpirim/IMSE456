<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" style="width:100%;height:420px;font-family:Arial,sans-serif">
<title id="title">The waterfall approach</title><desc id="desc">Six phases in a descending staircase: concept, requirements, design, build, test, release.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="420" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Waterfall: each phase finishes before the next begins</text><rect x="40" y="70" width="170" height="46" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="125" y="99" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Concept</text><path d="M210,93 L225,93 L225,119" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="190" y="122" width="170" height="46" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="275" y="151" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Requirements</text><path d="M360,145 L375,145 L375,171" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="340" y="174" width="170" height="46" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="425" y="203" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Design</text><path d="M510,197 L525,197 L525,223" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="490" y="226" width="170" height="46" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="575" y="255" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Build</text><path d="M660,249 L675,249 L675,275" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="640" y="278" width="170" height="46" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="725" y="307" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Test</text><path d="M810,301 L825,301 L825,327" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="790" y="330" width="170" height="46" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="875" y="359" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Release</text><text x="40" y="395" font-size="16" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Requirements are fixed early; the customer sees working software only at the end.</text></svg>
