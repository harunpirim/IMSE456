<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" style="width:100%;height:520px;font-family:Arial,sans-serif">
<title id="title">A sprint burndown chart</title><desc id="desc">Hours left against sprint day 0 to 10. The ideal line falls straight from 120 to 0; the actual line rises on day 3 when work is re-estimated and ends with 20 hours unfinished.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">A sprint burndown: hours of work left, updated every day</text><path d="M110,430.0 L860,430.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="100" y="435.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">0</text><path d="M110,345.0 L860,345.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="100" y="350.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">30</text><path d="M110,260.0 L860,260.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="100" y="265.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">60</text><path d="M110,175.0 L860,175.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="100" y="180.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">90</text><path d="M110,90.0 L860,90.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="100" y="95.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">120</text><text x="110.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">0</text><text x="185.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">1</text><text x="260.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">2</text><text x="335.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">3</text><text x="410.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">4</text><text x="485.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">5</text><text x="560.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">6</text><text x="635.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">7</text><text x="710.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">8</text><text x="785.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">9</text><text x="860.0" y="454" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">10</text><path d="M110,430 L860,430" fill="none" stroke="#203331" stroke-width="1.5"/><text x="485.0" y="480" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Sprint day</text><text x="34" y="260.0" font-size="15" fill="#203331" font-weight="700" text-anchor="middle" transform="rotate(-90 34 260.0)">Hours left</text><path d="M110.0,90.0 L860.0,430.0" fill="none" stroke="#627571" stroke-width="3" stroke-dasharray="9,6"/><path d="M110.0,90.0 L185.0,107.0 L260.0,129.7 L335.0,112.7 L410.0,146.7 L485.0,180.7 L560.0,203.3 L635.0,254.3 L710.0,299.7 L785.0,333.7 L860.0,373.3" fill="none" stroke="#0F5A4B" stroke-width="3.5"/><circle cx="110.0" cy="90.0" r="5" fill="#0F5A4B"/><circle cx="185.0" cy="107.0" r="5" fill="#0F5A4B"/><circle cx="260.0" cy="129.66666666666669" r="5" fill="#0F5A4B"/><circle cx="335.0" cy="112.66666666666669" r="5" fill="#0F5A4B"/><circle cx="410.0" cy="146.66666666666663" r="5" fill="#0F5A4B"/><circle cx="485.0" cy="180.66666666666669" r="5" fill="#0F5A4B"/><circle cx="560.0" cy="203.33333333333334" r="5" fill="#0F5A4B"/><circle cx="635.0" cy="254.33333333333331" r="5" fill="#0F5A4B"/><circle cx="710.0" cy="299.66666666666663" r="5" fill="#0F5A4B"/><circle cx="785.0" cy="333.6666666666667" r="5" fill="#0F5A4B"/><circle cx="860.0" cy="373.3333333333333" r="5" fill="#0F5A4B"/><text x="872.0" y="435.0" font-size="15" fill="#627571" font-weight="700" text-anchor="start">Ideal</text><text x="872.0" y="378.3333333333333" font-size="15" fill="#0F5A4B" font-weight="700" text-anchor="start">Actual</text><text x="335.0" y="94.66666666666669" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Work found: the line goes up</text><text x="872.0" y="397.3333333333333" font-size="14" fill="#B5543A" font-weight="700" text-anchor="start">20 h unfinished</text><text x="25" y="505" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Illustrative data. Remaining hours are re-estimated daily, so the line can rise as well as fall.</text></svg>
