<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" style="width:100%;height:460px;font-family:Arial,sans-serif">
<title id="title">The Scrum development process</title><desc id="desc">A prioritized product backlog feeds a sprint backlog; the sprint cycles through analysis, design, build and test with a daily scrum, and produces a demonstrated increment whose feedback reorders the backlog.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="460" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Scrum: a prioritized backlog feeds fixed-length sprints of working features</text><text x="95" y="92" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Product backlog</text><text x="95" y="110" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">prioritized</text><rect x="40" y="122" width="110" height="30" rx="3" fill="#0F5A4B" stroke="#0F5A4B" stroke-width="2"/><rect x="40" y="160" width="110" height="30" rx="3" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><rect x="40" y="198" width="110" height="30" rx="3" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><rect x="40" y="236" width="110" height="30" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><rect x="40" y="274" width="110" height="30" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><rect x="40" y="312" width="110" height="30" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="268" y="172" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Sprint backlog</text><text x="268" y="190" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">selected items</text><rect x="218" y="202" width="100" height="24" rx="3" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><rect x="218" y="232" width="100" height="24" rx="3" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><rect x="218" y="262" width="100" height="24" rx="3" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M155,140 L212,206" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M155,178 L212,236" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M155,216 L212,262" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><ellipse cx="560" cy="270" rx="185" ry="135" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><ellipse cx="560" cy="270" rx="82" ry="32" fill="#fff" stroke="#0F5A4B" stroke-width="2.5"/><text x="560" y="266" font-size="17" fill="#0F5A4B" font-weight="700" text-anchor="middle">Sprint</text><text x="560" y="285" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">1 to 4 weeks</text><text x="560" y="180" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Analysis</text><text x="690" y="276" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Design</text><text x="560" y="372" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Build</text><text x="430" y="276" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Test</text><path d="M610,190 C660,205 690,225 695,252" fill="none" stroke="#0F5A4B" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#g)"/><path d="M690,295 C680,335 640,358 600,366" fill="none" stroke="#0F5A4B" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#g)"/><path d="M520,366 C470,355 435,330 428,297" fill="none" stroke="#0F5A4B" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#g)"/><path d="M432,256 C440,220 470,195 512,184" fill="none" stroke="#0F5A4B" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#g)"/><path d="M322,270 L370,270" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><ellipse cx="560" cy="88" rx="95" ry="30" fill="#fff" stroke="#627571" stroke-width="2"/><text x="560" y="84" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Daily scrum</text><text x="560" y="102" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">every 24 hours</text><path d="M560,120 L560,132" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M750,270 L800,270" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="808" y="228" width="170" height="84" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="893" y="258" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="middle">Increment</text><text x="893" y="280" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">working features,</text><text x="893" y="297" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">demonstrated</text><path d="M893,315 C893,440 95,440 95,360" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#k)"/><text x="500" y="428" font-size="13" fill="#627571" font-weight="400" text-anchor="middle" font-style="italic">feedback reorders the product backlog</text></svg>
