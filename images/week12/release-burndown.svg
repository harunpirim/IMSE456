<title id="title">Release burndown for the conference app</title><desc id="desc">Story points left at the start of each sprint: 47, 31, 15 and 0 at 16 points a sprint, finishing Fri 11 Dec. The rehearsal on Thu 3 Dec falls inside sprint 3, with 15 points unbuilt.</desc>
