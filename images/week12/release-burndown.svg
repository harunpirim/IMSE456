<rect width="1000" height="520" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">The conference app's release plan at 16 points a sprint</text><path d="M160,420.0 L860,420.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="120" y="425.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">0</text><path d="M160,360.0 L860,360.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="120" y="365.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">10</text><path d="M160,300.0 L860,300.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="120" y="305.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">20</text><path d="M160,240.0 L860,240.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="120" y="245.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">30</text><path d="M160,180.0 L860,180.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="120" y="185.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">40</text><path d="M160,120.0 L860,120.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="120" y="125.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">50</text><text x="160.0" y="444" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">Mon 2 Nov</text><text x="393.3333333333333" y="444" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">Fri 13 Nov</text><text x="626.6666666666666" y="444" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">Fri 27 Nov</text><text x="860.0" y="444" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">Fri 11 Dec</text><text x="276.66666666666663" y="464" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Sprint 1</text><text x="510.0" y="464" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Sprint 2</text><text x="743.3333333333333" y="464" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Sprint 3</text><path d="M160,420 L860,420" fill="none" stroke="#203331" stroke-width="1.5"/><text x="34" y="255.0" font-size="15" fill="#203331" font-weight="700" text-anchor="middle" transform="rotate(-90 34 255.0)">Story points left</text><rect x="135.0" y="138.0" width="54" height="282.0" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="160.0" y="128.0" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">47</text><rect x="368.3333333333333" y="234.0" width="54" height="186.0" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="393.3333333333333" y="224.0" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">31</text><rect x="601.6666666666666" y="330.0" width="54" height="90.0" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="626.6666666666666" y="320.0" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">15</text><path d="M160.0,138.0 L393.3,234.0 L626.7,330.0 L860.0,420.0" fill="none" stroke="#0F5A4B" stroke-width="3" stroke-dasharray="9,6"/><path d="M720.0,80 L720.0,420" fill="none" stroke="#B5543A" stroke-width="2.5" stroke-dasharray="5,5"/><text x="728.0" y="96" font-size="15" fill="#B5543A" font-weight="700" text-anchor="start">Rehearsal, Thu 3 Dec:</text><text x="728.0" y="116" font-size="14" fill="#B5543A" font-weight="400" text-anchor="start">the app must be live</text><text x="590.6666666666666" y="360.0" font-size="14" fill="#203331" font-weight="700" text-anchor="end">15 points still unbuilt</text><text x="25" y="505" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Two full sprints fit before the rehearsal; the third ends eight days after it.</text></svg>
