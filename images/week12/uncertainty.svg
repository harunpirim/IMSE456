<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc" style="width:100%;height:540px;font-family:Arial,sans-serif">
<title id="title">Project uncertainty and the choice of method</title><desc id="desc">Two axes, technology and scope. Known technology and defined scope form the predictable zone; the opposite corner is the unpredictable zone where agile works.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="540" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Plan-driven methods suit the predictable corner; agile suits the rest</text><path d="M140,70 L900,70 L900,470 Z" fill="#E9F3EF"/><path d="M140,70 L140,470 L900,470 Z" fill="#F5F7F7"/><path d="M140,470 L900,470" fill="none" stroke="#203331" stroke-width="2"/><path d="M140,470 L140,70" fill="none" stroke="#203331" stroke-width="2"/><path d="M140,70 L900,470" fill="none" stroke="#627571" stroke-width="2" stroke-dasharray="8,6"/><text x="520.0" y="510" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Technology: well known → unknown</text><text x="60" y="270.0" font-size="16" fill="#203331" font-weight="700" text-anchor="middle" transform="rotate(-90 60 270.0)">Scope: well defined → ill defined</text><text x="170" y="420" font-size="22" fill="#203331" font-weight="700" text-anchor="start">Predictable zone</text><text x="170" y="446" font-size="16" fill="#627571" font-weight="400" text-anchor="start">plan-driven, traditional PM</text><text x="870" y="110" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="end">Unpredictable zone</text><text x="870" y="134" font-size="16" fill="#0F5A4B" font-weight="400" text-anchor="end">experimental, adaptive: agile PM</text><circle cx="260" cy="370" r="7" fill="#627571"/><text x="274" y="375" font-size="14" fill="#203331" font-weight="400" text-anchor="start">Repave a car park</text><circle cx="420" cy="330" r="7" fill="#627571"/><text x="434" y="335" font-size="14" fill="#203331" font-weight="400" text-anchor="start">Book a venue</text><circle cx="430" cy="180" r="7" fill="#0F5A4B"/><text x="444" y="185" font-size="14" fill="#203331" font-weight="400" text-anchor="start">New attendee app</text><circle cx="680" cy="175" r="7" fill="#0F5A4B"/><text x="694" y="180" font-size="14" fill="#203331" font-weight="400" text-anchor="start">New product, new technology</text></svg>
