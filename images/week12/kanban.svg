<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" style="width:100%;height:470px;font-family:Arial,sans-serif">
<title id="title">A Kanban board with WIP limits</title><desc id="desc">Five columns: to do, ready, in progress with a limit of three, test with a limit of two, and done. In progress is full, so no new card can be pulled into it.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="470" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">A Kanban board: work is pulled right, and WIP limits cap each column</text><rect x="25" y="62" width="180" height="370" rx="6" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><text x="115" y="92" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">To do</text><text x="115" y="114" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">no limit</text><rect x="37" y="130" width="156" height="50" rx="4" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="115" y="160" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Exhibitor map</text><rect x="37" y="192" width="156" height="50" rx="4" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="115" y="222" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Feedback form</text><rect x="37" y="254" width="156" height="50" rx="4" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="115" y="284" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Sponsor banner</text><rect x="217" y="62" width="180" height="370" rx="6" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><text x="307" y="92" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Ready</text><text x="307" y="114" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">WIP limit 3</text><rect x="229" y="130" width="156" height="50" rx="4" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="307" y="160" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Speaker profiles</text><rect x="229" y="192" width="156" height="50" rx="4" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="307" y="222" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Room-change notice</text><rect x="409" y="62" width="180" height="370" rx="6" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="3"/><text x="499" y="92" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">In progress</text><text x="499" y="114" font-size="13" fill="#0F5A4B" font-weight="700" text-anchor="middle">WIP limit 3</text><rect x="421" y="130" width="156" height="50" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="1.5"/><text x="499" y="160" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Personal schedule</text><rect x="421" y="192" width="156" height="50" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="1.5"/><text x="499" y="222" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Check-in scan</text><rect x="421" y="254" width="156" height="50" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="1.5"/><text x="499" y="284" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">QR door test</text><rect x="601" y="62" width="180" height="370" rx="6" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><text x="691" y="92" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Test</text><text x="691" y="114" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">WIP limit 2</text><rect x="613" y="130" width="156" height="50" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="1.5"/><text x="691" y="160" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Program views</text><rect x="793" y="62" width="180" height="370" rx="6" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><text x="883" y="92" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Done</text><text x="883" y="114" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">no limit</text><rect x="805" y="130" width="156" height="50" rx="4" fill="#E9F3EF" stroke="#627571" stroke-width="1.5"/><text x="883" y="160" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Register and pay</text><rect x="805" y="192" width="156" height="50" rx="4" fill="#E9F3EF" stroke="#627571" stroke-width="1.5"/><text x="883" y="222" font-size="14" fill="#203331" font-weight="400" text-anchor="middle">Email with QR</text><text x="505" y="352" font-size="13" fill="#0F5A4B" font-weight="700" text-anchor="middle">Full: nobody pulls</text><text x="505" y="370" font-size="13" fill="#0F5A4B" font-weight="700" text-anchor="middle">new work in</text><text x="25" y="455" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">A card moves only when the next column has room, so a blocked item shows as a full column, not as hidden effort.</text></svg>
