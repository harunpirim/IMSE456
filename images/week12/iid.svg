<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc" style="width:100%;height:400px;font-family:Arial,sans-serif">
<title id="title">Iterative, incremental development</title><desc id="desc">Four iterations in a row, each producing a working increment; the stack of increments grows and feedback from each increment feeds the next iteration.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="400" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Iterative, incremental development: each cycle adds a working piece</text><ellipse cx="130" cy="140" rx="90" ry="48" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="130" y="135" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Iteration 1</text><text x="130" y="157" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">plan · build · test</text><rect x="85" y="300" width="90" height="22" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M130,190 L130,294" fill="none" stroke="#0F5A4B" stroke-width="2" marker-end="url(#g)"/><path d="M222,140 L276,140" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M190,232 C250,220 280,210 310,186" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#k)"/><ellipse cx="370" cy="140" rx="90" ry="48" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="370" y="135" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Iteration 2</text><text x="370" y="157" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">plan · build · test</text><rect x="325" y="300" width="90" height="22" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><rect x="325" y="274" width="90" height="22" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M370,190 L370,268" fill="none" stroke="#0F5A4B" stroke-width="2" marker-end="url(#g)"/><path d="M462,140 L516,140" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M430,232 C490,220 520,210 550,186" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#k)"/><ellipse cx="610" cy="140" rx="90" ry="48" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="610" y="135" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Iteration 3</text><text x="610" y="157" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">plan · build · test</text><rect x="565" y="300" width="90" height="22" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><rect x="565" y="274" width="90" height="22" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><rect x="565" y="248" width="90" height="22" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M610,190 L610,242" fill="none" stroke="#0F5A4B" stroke-width="2" marker-end="url(#g)"/><path d="M702,140 L756,140" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M670,232 C730,220 760,210 790,186" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#k)"/><ellipse cx="850" cy="140" rx="90" ry="48" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="850" y="135" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Iteration 4</text><text x="850" y="157" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">plan · build · test</text><rect x="805" y="300" width="90" height="22" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><rect x="805" y="274" width="90" height="22" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><rect x="805" y="248" width="90" height="22" rx="4" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><rect x="805" y="222" width="90" height="22" rx="4" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><path d="M850,190 L850,216" fill="none" stroke="#0F5A4B" stroke-width="2" marker-end="url(#g)"/><text x="380" y="225" font-size="13" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">feedback</text><text x="25" y="380" font-size="16" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">The product grows one usable increment at a time; the customer's feedback steers the next cycle.</text></svg>
