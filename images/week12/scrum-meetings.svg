<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" style="width:100%;height:300px;font-family:Arial,sans-serif">
<title id="title">Scrum meetings</title><desc id="desc">Release planning once, then each sprint runs sprint planning, daily scrums every 24 hours, a sprint review and a sprint retrospective, and loops back to sprint planning.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="300" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Five meetings, and the loop that repeats every sprint</text><ellipse cx="100" cy="170" rx="82" ry="40" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="100" y="166" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Release</text><text x="100" y="186" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">planning</text><ellipse cx="290" cy="170" rx="82" ry="40" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="290" y="166" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Sprint</text><text x="290" y="186" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">planning</text><ellipse cx="480" cy="170" rx="82" ry="40" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="480" y="166" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Daily</text><text x="480" y="186" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">scrum</text><ellipse cx="670" cy="170" rx="82" ry="40" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="670" y="166" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Sprint</text><text x="670" y="186" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">review</text><ellipse cx="870" cy="170" rx="82" ry="40" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="870" y="166" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Sprint</text><text x="870" y="186" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">retrospective</text><path d="M184,170 L204,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M374,170 L394,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M564,170 L584,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M754,170 L784,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M440,206 C440,262 520,262 520,206" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><text x="480" y="278" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">every 24 hours</text><path d="M870,128 C870,72 290,72 290,124" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><text x="580" y="80" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">next sprint</text></svg>
