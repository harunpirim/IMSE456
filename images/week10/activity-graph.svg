<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" style="width:100%;height:500px;font-family:Arial,sans-serif">
<title id="title">Activity cost-duration graph</title><desc id="desc">One activity with a normal point of 10 time units at $400 and a crash point of 5 time units at $800, joined by a straight line whose slope is $80 per unit.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="500" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">One activity: normal point, crash point, and the straight line between them</text><path d="M140,420.0 L820,420.0" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="130" y="425.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">$0</text><path d="M140,342.22222222222223 L820,342.22222222222223" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="130" y="347.22222222222223" font-size="14" fill="#627571" font-weight="400" text-anchor="end">$200</text><path d="M140,264.44444444444446 L820,264.44444444444446" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="130" y="269.44444444444446" font-size="14" fill="#627571" font-weight="400" text-anchor="end">$400</text><path d="M140,186.66666666666669 L820,186.66666666666669" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="130" y="191.66666666666669" font-size="14" fill="#627571" font-weight="400" text-anchor="end">$600</text><path d="M140,108.88888888888891 L820,108.88888888888891" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="130" y="113.88888888888891" font-size="14" fill="#627571" font-weight="400" text-anchor="end">$800</text><text x="140.0" y="442" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">0</text><text x="449.09090909090907" y="442" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">5</text><text x="758.1818181818181" y="442" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">10</text><path d="M140,420 L820,420" fill="none" stroke="#203331" stroke-width="1.5"/><text x="480.0" y="468" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Activity duration, time units</text><path d="M140,420 L140,70" fill="none" stroke="#203331" stroke-width="1.5"/><text x="40" y="245.0" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Cost</text><path d="M449.09090909090907,108.88888888888891 L758.1818181818181,264.44444444444446" fill="none" stroke="#0F5A4B" stroke-width="4"/><path d="M140,108.88888888888891 L449.09090909090907,108.88888888888891 L449.09090909090907,420" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="5,5"/><path d="M140,264.44444444444446 L758.1818181818181,264.44444444444446 L758.1818181818181,420" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="5,5"/><rect x="441.09090909090907" y="100.88888888888891" width="16" height="16" fill="#fff" stroke="#0F5A4B" stroke-width="3"/><rect x="750.1818181818181" y="256.44444444444446" width="16" height="16" fill="#fff" stroke="#0F5A4B" stroke-width="3"/><text x="467.09090909090907" y="96.88888888888891" font-size="15" fill="#0F5A4B" font-weight="700" text-anchor="start">Crash point: 5 units, $800</text><text x="742.1818181818181" y="296.44444444444446" font-size="15" fill="#0F5A4B" font-weight="700" text-anchor="end">Normal point: 10 units, $400</text><text x="623.6363636363636" y="180.66666666666669" font-size="15" fill="#203331" font-weight="700" text-anchor="start">slope = $400 ÷ 5 = $80 per unit</text><text x="25" y="485" font-size="13" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Redrawn from Larson &amp; Gray, Ch. 9, Figure 9.2. The line assumes every unit of time saved costs the same.</text></svg>
