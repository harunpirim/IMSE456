<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc" style="width:100%;height:735px;font-family:Arial,sans-serif">
<title id="title">Conference cost-duration graph</title><desc id="desc">Two panels. Top: total cost from 25 down to 16 workdays, lowest at 18 days, $92,200. Bottom: direct cost rising from $70,000 to $76,900 and indirect cost falling from $25,000 to $16,000.</desc>
