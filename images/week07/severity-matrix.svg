<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc" style="width:100%;height:640px;font-family:Arial,sans-serif">
<title id="title">Risk severity matrix with conference risks</title><desc id="desc">Five-by-five likelihood and impact grid. The major zone covers likelihood 4–5 at impact 4–5 and the whole impact-5 column from likelihood 2 up; minor covers the lower-left corner; moderate lies between. Five conference risks are plotted.</desc>
