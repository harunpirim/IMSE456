<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" style="width:100%;height:300px;font-family:Arial,sans-serif">
<title id="title">Change control process</title><desc id="desc">A change originates, a request is submitted, its impact is reviewed and a decision is made. Approved changes update the baseline and are announced to those affected; rejected or deferred requests return for revision.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="300" fill="#fff"/><text x="25" y="36" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="start">Every change runs the same gate before it touches the baseline</text><rect x="20" y="110" width="138" height="76" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="89.0" y="142.0" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Change</text><text x="89.0" y="163.25" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">originates</text><path d="M158,148.0 L180,148.0" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="184" y="110" width="138" height="76" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="253.0" y="142.0" font-size="17" fill="#203331" font-weight="400" text-anchor="middle">Request</text><text x="253.0" y="163.25" font-size="17" fill="#203331" font-weight="400" text-anchor="middle">submitted</text><path d="M322,148.0 L344,148.0" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="348" y="110" width="138" height="76" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="417.0" y="142.0" font-size="17" fill="#203331" font-weight="400" text-anchor="middle">Impact</text><text x="417.0" y="163.25" font-size="17" fill="#203331" font-weight="400" text-anchor="middle">reviewed</text><path d="M486,148.0 L502,148.0" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><polygon points="581.0,96 656,148.0 581.0,200 506,148.0" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="581.0" y="154.0" font-size="17" fill="#0F5A4B" font-weight="700" text-anchor="middle">Approve?</text><path d="M656,148.0 L672,148.0" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="676" y="110" width="138" height="76" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="745.0" y="142.0" font-size="17" fill="#203331" font-weight="400" text-anchor="middle">Baseline</text><text x="745.0" y="163.25" font-size="17" fill="#203331" font-weight="400" text-anchor="middle">updated</text><path d="M814,148.0 L836,148.0" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="840" y="110" width="138" height="76" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="909.0" y="142.0" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Change</text><text x="909.0" y="163.25" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">announced</text><path d="M581.0,200 L581.0,256 L253.0,256 L253.0,190" fill="none" stroke="#627571" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#k)"/><text x="417.0" y="278" font-size="16" fill="#627571" font-weight="400" text-anchor="middle">No: revise and resubmit, defer, or close</text><text x="672" y="120" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="end">Yes</text></svg>
