<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" style="width:100%;height:560px;font-family:Arial,sans-serif">
<title id="title">The four-step risk management process</title><desc id="desc">Identify, assess, plan responses and control, in sequence, with new risks found during control fed back to identification.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="560" fill="#fff"/><text x="25" y="36" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="start">Risk management is a loop, not a one-time list</text><rect x="330" y="70" width="340" height="92" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="500.0" y="102" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="middle">1 · Identify</text><text x="500.0" y="128.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">Find the events that</text><text x="500.0" y="148.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">could affect the project</text><path d="M500.0,162 L500.0,188" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><text x="512.0" y="182" font-size="15" fill="#627571" font-weight="400" text-anchor="start">Known risks</text><rect x="330" y="190" width="340" height="92" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="500.0" y="222" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="middle">2 · Assess</text><text x="500.0" y="248.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">Rate likelihood, impact</text><text x="500.0" y="268.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">and how hard to detect</text><path d="M500.0,282 L500.0,308" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><text x="512.0" y="302" font-size="15" fill="#627571" font-weight="400" text-anchor="start">Ranked risks</text><rect x="330" y="310" width="340" height="92" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="500.0" y="342" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="middle">3 · Plan responses</text><text x="500.0" y="368.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">Choose a response;</text><text x="500.0" y="388.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">write contingency plans</text><path d="M500.0,402 L500.0,428" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><text x="512.0" y="422" font-size="15" fill="#627571" font-weight="400" text-anchor="start">Risk register</text><rect x="330" y="430" width="340" height="92" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="500.0" y="462" font-size="21" fill="#0F5A4B" font-weight="700" text-anchor="middle">4 · Control</text><text x="500.0" y="488.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">Act, monitor triggers,</text><text x="500.0" y="508.0" font-size="16" fill="#203331" font-weight="400" text-anchor="middle">manage change</text><path d="M330,476 L210,476 L210,116 L324,116" fill="none" stroke="#0F5A4B" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#g)"/><text x="195" y="300.0" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="end">New risks</text><text x="195" y="320.0" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="end">feed back</text><text x="195" y="340.0" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="end">into step 1</text><text x="700" y="460" font-size="16" fill="#627571" font-weight="400" text-anchor="start">Trigger fires →</text><text x="700" y="482" font-size="16" fill="#627571" font-weight="400" text-anchor="start">contingency plan</text><text x="700" y="504" font-size="16" fill="#627571" font-weight="400" text-anchor="start">becomes a change</text></svg>
