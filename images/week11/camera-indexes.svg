<title id="title">Digital Camera performance indexes</title><desc id="desc">CPI, SPI and PCIB for periods 1 to 7. CPI drops to .67 in period 2 and ends at .70; SPI peaks at 1.10 in period 3 and ends at .80; PCIB rises to .50.</desc>
