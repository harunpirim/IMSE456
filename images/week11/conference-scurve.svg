<title id="title">Conference cost and schedule graph at week 3</title><desc id="desc">Planned value for the conference rising to 70,000 dollars at workday 25. Earned value and actual cost at weeks 1 to 3 track close together, 50,000 and 48,700, below planned value of 59,000. The network forecasts a finish at workday 30.</desc>
