<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" style="width:100%;height:640px;font-family:Arial,sans-serif">
<title id="title">Conference tracking Gantt chart at week 3</title><desc id="desc">Baseline bars above actual and forecast bars for nine activities. Draft program took 11 days instead of 6, so Confirm speakers and everything after it moved five workdays, and the forecast finish is Friday 11 December instead of Friday 4 December.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="640" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">The conference at the end of week 3: the program slipped, and everything after it moved</text><path d="M270.0,70 L270.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="270.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">0</text><path d="M385.0,70 L385.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="385.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">5</text><path d="M500.0,70 L500.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="500.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">10</text><path d="M615.0,70 L615.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="615.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">15</text><path d="M730.0,70 L730.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="730.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">20</text><path d="M845.0,70 L845.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="845.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">25</text><path d="M960.0,70 L960.0,570" fill="none" stroke="#E0E7E4" stroke-width="1"/><text x="960.0" y="64" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">30</text><text x="25" y="112" font-size="15" fill="#203331" font-weight="700" text-anchor="start">A  Approve event brief</text><rect x="270.0" y="90" width="46.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="270.0" y="108" width="46.0" height="16" rx="3" fill="#0F5A4B"/><text x="25" y="164" font-size="15" fill="#203331" font-weight="400" text-anchor="start">B  Contract venue</text><rect x="316.0" y="142" width="115.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="316.0" y="160" width="92.0" height="16" rx="3" fill="#0F5A4B"/><text x="25" y="216" font-size="15" fill="#203331" font-weight="700" text-anchor="start">C  Draft program</text><rect x="316.0" y="194" width="138.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="316.0" y="212" width="253.0" height="16" rx="3" fill="#0F5A4B"/><text x="25" y="268" font-size="15" fill="#203331" font-weight="400" text-anchor="start">D  Configure registration</text><rect x="431.0" y="246" width="92.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="408.0" y="264" width="92.0" height="16" rx="3" fill="#0F5A4B"/><text x="25" y="320" font-size="15" fill="#203331" font-weight="700" text-anchor="start">E  Confirm speakers</text><rect x="454.0" y="298" width="184.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="615.0" y="316" width="138.0" height="16" rx="3" fill="#fff" stroke="#0F5A4B" stroke-width="1.5" stroke-dasharray="4,3"/><rect x="569.0" y="316" width="46.0" height="16" rx="3" fill="#0F5A4B"/><text x="25" y="372" font-size="15" fill="#203331" font-weight="400" text-anchor="start">F  Recruit exhibitors</text><rect x="454.0" y="350" width="115.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="615.0" y="368" width="69.0" height="16" rx="3" fill="#fff" stroke="#0F5A4B" stroke-width="1.5" stroke-dasharray="4,3"/><rect x="569.0" y="368" width="46.0" height="16" rx="3" fill="#0F5A4B"/><text x="25" y="424" font-size="15" fill="#203331" font-weight="700" text-anchor="start">G  Publish program</text><rect x="638.0" y="402" width="69.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="753.0" y="420" width="69.0" height="16" rx="3" fill="#fff" stroke="#0F5A4B" stroke-width="1.5" stroke-dasharray="4,3"/><text x="25" y="476" font-size="15" fill="#203331" font-weight="700" text-anchor="start">H  Prepare on-site materials</text><rect x="707.0" y="454" width="92.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="822.0" y="472" width="92.0" height="16" rx="3" fill="#fff" stroke="#0F5A4B" stroke-width="1.5" stroke-dasharray="4,3"/><text x="25" y="528" font-size="15" fill="#203331" font-weight="700" text-anchor="start">I  Complete rehearsal</text><rect x="799.0" y="506" width="46.0" height="14" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><rect x="914.0" y="524" width="46.0" height="16" rx="3" fill="#fff" stroke="#0F5A4B" stroke-width="1.5" stroke-dasharray="4,3"/><path d="M615.0,70 L615.0,575" fill="none" stroke="#B5543A" stroke-width="2.5"/><text x="615.0" y="592" font-size="14" fill="#B5543A" font-weight="700" text-anchor="middle">Today: Fri 20 Nov, workday 15</text><path d="M845.0,70 L845.0,575" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="5,4"/><text x="839.0" y="556" font-size="12" fill="#627571" font-weight="400" text-anchor="end">Planned finish, Fri 4 Dec</text><text x="956.0" y="556" font-size="12" fill="#B5543A" font-weight="700" text-anchor="end">Fri 11 Dec</text><rect x="25" y="606" width="34" height="12" rx="3" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><text x="67" y="617" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Baseline</text><rect x="155" y="606" width="34" height="12" rx="3" fill="#0F5A4B"/><text x="197" y="617" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Actual, completed</text><rect x="345" y="606" width="34" height="12" rx="3" fill="#fff" stroke="#0F5A4B" stroke-dasharray="4,3"/><text x="387" y="617" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Remaining or forecast</text><text x="565" y="617" font-size="13" fill="#627571" font-weight="400" text-anchor="start">Bold names: the baseline critical path. Workdays from Mon 2 Nov.</text><text x="25" y="636" font-size="12" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Layout follows the tracking Gantt chart of Larson &amp; Gray, Ch. 13, Figure 13.1. The conference data are original to this course.</text></svg>
