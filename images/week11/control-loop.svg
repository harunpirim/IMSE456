<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" style="width:100%;height:420px;font-family:Arial,sans-serif">
<title id="title">The project control cycle</title><desc id="desc">Four boxes: set the baseline, measure, compare, act, with a loop from act back to measure each reporting period.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="420" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Control is a loop: the baseline is the anchor every measurement is compared with</text><rect x="40" y="120" width="200" height="130" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="3"/><text x="140" y="160" font-size="26" fill="#0F5A4B" font-weight="700" text-anchor="middle">1</text><text x="140" y="195" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">Set the baseline</text><text x="140" y="222" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">time-phased budget and schedule</text><rect x="280" y="120" width="200" height="130" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="380" y="160" font-size="26" fill="#0F5A4B" font-weight="700" text-anchor="middle">2</text><text x="380" y="195" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">Measure</text><text x="380" y="222" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">progress and actual cost</text><rect x="520" y="120" width="200" height="130" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="620" y="160" font-size="26" fill="#0F5A4B" font-weight="700" text-anchor="middle">3</text><text x="620" y="195" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">Compare</text><text x="620" y="222" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">plan against actual</text><rect x="760" y="120" width="200" height="130" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="860" y="160" font-size="26" fill="#0F5A4B" font-weight="700" text-anchor="middle">4</text><text x="860" y="195" font-size="18" fill="#203331" font-weight="700" text-anchor="middle">Act</text><text x="860" y="222" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">correct, or change the baseline</text><path d="M244,185 L276,185" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><path d="M484,185 L516,185" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><path d="M724,185 L756,185" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><path d="M860,254 L860,320 L380,320 L380,258" fill="none" stroke="#0F5A4B" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#g)"/><text x="620.0" y="345" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">every report period, every one to four weeks</text><text x="25" y="400" font-size="13" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">The four steps of Larson &amp; Gray, Ch. 13, Section 13.2, drawn as a cycle.</text></svg>
