<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" style="width:100%;height:600px;font-family:Arial,sans-serif">
<title id="title">The network of project stakeholders</title><desc id="desc">The project manager at the centre. Inside the organization: project team, top management, project sponsors, other project managers, functional managers, administrative support. Outside: customers, contractors, vendors and suppliers, government agencies, other organizations.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="600" fill="#fff"/><text x="25" y="36" font-size="20" fill="#0F5A4B" font-weight="700" text-anchor="start">The project manager sits in a web of stakeholders, most of whom do not report to them</text><ellipse cx="500" cy="330" rx="455" ry="245" fill="#fff" stroke="#627571" stroke-width="1.5"/><ellipse cx="500" cy="330" rx="285" ry="160" fill="#F5F7F7" stroke="#627571" stroke-width="1.5"/><text x="500" y="158" font-size="14" fill="#627571" font-weight="700" text-anchor="middle">Inside the performing organization</text><text x="150" y="160" font-size="14" fill="#627571" font-weight="700" text-anchor="middle">Outside the organization</text><ellipse cx="500" cy="330" rx="78" ry="34" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2.5"/><text x="500" y="326.3333333333333" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="middle">Project</text><text x="500" y="344.3333333333333" font-size="16" fill="#0F5A4B" font-weight="700" text-anchor="middle">manager</text><path d="M500.0,290.9 L500.0,242.0" fill="none" stroke="#0F5A4B" stroke-width="1.8"/><rect x="434.0" y="196.0" width="132" height="44" rx="8" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><text x="500.0" y="222.66666666666666" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Project team</text><path d="M570.9274805699455,310.45 L632.5018867790191,286.0" fill="none" stroke="#0F5A4B" stroke-width="1.8"/><rect x="611.5352077758099" y="252.0" width="132" height="44" rx="8" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><text x="677.5352077758099" y="269.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Top</text><text x="677.5352077758099" y="287.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">management</text><path d="M570.9274805699455,349.55 L632.5018867790191,374.00000000000006" fill="none" stroke="#0F5A4B" stroke-width="1.8"/><rect x="611.5352077758099" y="364.00000000000006" width="132" height="44" rx="8" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><text x="677.5352077758099" y="381.66666666666674" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Project</text><text x="677.5352077758099" y="399.66666666666674" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">sponsors</text><path d="M500.0,369.1 L499.99999999999994,418.0" fill="none" stroke="#0F5A4B" stroke-width="1.8"/><rect x="433.99999999999994" y="420.0" width="132" height="44" rx="8" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><text x="499.99999999999994" y="437.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Other project</text><text x="499.99999999999994" y="455.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">managers</text><path d="M429.07251943005446,349.55 L367.4981132209809,374.0" fill="none" stroke="#0F5A4B" stroke-width="1.8"/><rect x="256.4647922241901" y="364.0" width="132" height="44" rx="8" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><text x="322.4647922241901" y="381.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Functional</text><text x="322.4647922241901" y="399.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">managers</text><path d="M429.07251943005446,310.45 L367.4981132209809,286.0" fill="none" stroke="#0F5A4B" stroke-width="1.8"/><rect x="256.4647922241901" y="252.0" width="132" height="44" rx="8" fill="#fff" stroke="#0F5A4B" stroke-width="2"/><text x="322.4647922241901" y="269.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Administrative</text><text x="322.4647922241901" y="287.6666666666667" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">support</text><rect x="434.0" y="103.0" width="132" height="44" rx="8" fill="#fff" stroke="#627571" stroke-width="2"/><text x="500.0" y="129.66666666666666" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Customers</text><rect x="800.1567587736341" y="244.6515161531358" width="132" height="44" rx="8" fill="#fff" stroke="#627571" stroke-width="2"/><text x="866.1567587736341" y="271.3181828198025" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Contractors</text><rect x="660.2973221326021" y="473.84848384686427" width="132" height="44" rx="8" fill="#fff" stroke="#627571" stroke-width="2"/><text x="726.2973221326021" y="491.51515051353095" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Vendors/</text><text x="726.2973221326021" y="509.51515051353095" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">suppliers</text><rect x="207.70267786739782" y="473.8484838468642" width="132" height="44" rx="8" fill="#fff" stroke="#627571" stroke-width="2"/><text x="273.7026778673978" y="491.5151505135309" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Government</text><text x="273.7026778673978" y="509.5151505135309" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">agencies</text><rect x="67.84324122636588" y="244.65151615313573" width="132" height="44" rx="8" fill="#fff" stroke="#627571" stroke-width="2"/><text x="133.84324122636588" y="262.3181828198024" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">Other</text><text x="133.84324122636588" y="280.3181828198024" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">organizations</text><text x="25" y="585" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">The inner ring is the performing organization. The project manager has formal authority over little of either ring.</text></svg>
