<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" style="width:100%;height:440px;font-family:Arial,sans-serif">
<title id="title">Sources of conflict over the project life cycle</title><desc id="desc">Ranked sources of conflict in four phases. Defining: priorities, procedures, schedule. Planning: priorities, schedule, procedures, technical, workforce. Executing: schedule, technical, workforce, priorities. Delivery: schedule.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="440" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">What teams fight about changes as the project moves through its life cycle</text><path d="M194,70 L350,70 L366,92 L350,114 L194,114 Z" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="272.0" y="98" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Defining</text><path d="M374,70 L530,70 L546,92 L530,114 L374,114 Z" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="452.0" y="98" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Planning</text><path d="M554,70 L710,70 L726,92 L710,114 L554,114 Z" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="632.0" y="98" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Executing</text><path d="M734,70 L890,70 L906,92 L890,114 L734,114 Z" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="812.0" y="98" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Delivery</text><text x="174" y="162" font-size="16" fill="#203331" font-weight="700" text-anchor="end">Priorities</text><path d="M190,182 L910,182" fill="none" stroke="#E0E7E4" stroke-width="1"/><circle cx="272.0" cy="156" r="20.0" fill="#0F5A4B"/><text x="272.0" y="161" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="452.0" cy="156" r="20.0" fill="#0F5A4B"/><text x="452.0" y="161" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="632.0" cy="156" r="12.5" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="632.0" y="161" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">4</text><text x="174" y="214" font-size="16" fill="#203331" font-weight="700" text-anchor="end">Procedures</text><path d="M190,234 L910,234" fill="none" stroke="#E0E7E4" stroke-width="1"/><circle cx="272.0" cy="208" r="17.5" fill="#8FB8AD" stroke="#0F5A4B" stroke-width="2"/><text x="272.0" y="213" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="452.0" cy="208" r="15.0" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="452.0" y="213" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">3</text><text x="174" y="266" font-size="16" fill="#203331" font-weight="700" text-anchor="end">Schedule</text><path d="M190,286 L910,286" fill="none" stroke="#E0E7E4" stroke-width="1"/><circle cx="272.0" cy="260" r="15.0" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="272.0" y="265" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">3</text><circle cx="452.0" cy="260" r="17.5" fill="#8FB8AD" stroke="#0F5A4B" stroke-width="2"/><text x="452.0" y="265" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="632.0" cy="260" r="20.0" fill="#0F5A4B"/><text x="632.0" y="265" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="812.0" cy="260" r="20.0" fill="#0F5A4B"/><text x="812.0" y="265" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="174" y="318" font-size="16" fill="#203331" font-weight="700" text-anchor="end">Technical</text><path d="M190,338 L910,338" fill="none" stroke="#E0E7E4" stroke-width="1"/><circle cx="452.0" cy="312" r="12.5" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="452.0" y="317" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">4</text><circle cx="632.0" cy="312" r="17.5" fill="#8FB8AD" stroke="#0F5A4B" stroke-width="2"/><text x="632.0" y="317" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="174" y="370" font-size="16" fill="#203331" font-weight="700" text-anchor="end">Workforce</text><path d="M190,390 L910,390" fill="none" stroke="#E0E7E4" stroke-width="1"/><circle cx="452.0" cy="364" r="10.0" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="452.0" y="369" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">5</text><circle cx="632.0" cy="364" r="15.0" fill="#F5F7F7" stroke="#0F5A4B" stroke-width="2"/><text x="632.0" y="369" font-size="14" fill="#203331" font-weight="700" text-anchor="middle">3</text><text x="25" y="420" font-size="14" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Numbers give the order each phase's sources are listed in, 1 first. A blank cell: not among that phase's major sources.</text></svg>
