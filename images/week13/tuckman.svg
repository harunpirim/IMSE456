<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc" style="width:100%;height:430px;font-family:Arial,sans-serif">
<title id="title">The five-stage team development model</title><desc id="desc">Forming, storming, norming, performing and adjourning, each with its project activity and group process.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="430" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Five stages a project group passes through on its way to being a team</text><text x="25" y="160" font-size="14" fill="#627571" font-weight="700" text-anchor="start">Project</text><text x="25" y="177" font-size="14" fill="#627571" font-weight="700" text-anchor="start">activity</text><text x="25" y="270" font-size="14" fill="#627571" font-weight="700" text-anchor="start">Group</text><text x="25" y="287" font-size="14" fill="#627571" font-weight="700" text-anchor="start">process</text><rect x="110" y="70" width="160" height="50" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="190" y="92" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Stage 1</text><text x="190" y="111" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Forming</text><rect x="110" y="135" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="190" y="163.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Orientation to</text><text x="190" y="181.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">the project</text><rect x="110" y="245" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="190" y="273.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Testing and</text><text x="190" y="291.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">dependence</text><path d="M270,95 L284,95" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="286" y="70" width="160" height="50" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="366" y="92" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Stage 2</text><text x="366" y="111" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Storming</text><rect x="286" y="135" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="366" y="163.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Emotional response to</text><text x="366" y="181.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">its demands</text><rect x="286" y="245" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="366" y="273.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Conflict inside</text><text x="366" y="291.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">the group</text><path d="M446,95 L460,95" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="462" y="70" width="160" height="50" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="542" y="92" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Stage 3</text><text x="542" y="111" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Norming</text><rect x="462" y="135" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="542" y="163.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Open exchange</text><text x="542" y="181.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">of information</text><rect x="462" y="245" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="542" y="273.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Cohesion</text><text x="542" y="291.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">develops</text><path d="M622,95 L636,95" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="638" y="70" width="160" height="50" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="718" y="92" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Stage 4</text><text x="718" y="111" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Performing</text><rect x="638" y="135" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="718" y="163.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">A solution</text><text x="718" y="181.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">emerges</text><rect x="638" y="245" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="718" y="273.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Functional roles</text><text x="718" y="291.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">emerge</text><path d="M798,95 L812,95" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><rect x="814" y="70" width="160" height="50" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="894" y="92" font-size="13" fill="#627571" font-weight="400" text-anchor="middle">Stage 5</text><text x="894" y="111" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Adjourning</text><rect x="814" y="135" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="894" y="163.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">Wrapping</text><text x="894" y="181.33333333333334" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">up</text><rect x="814" y="245" width="160" height="66" rx="8" fill="#fff" stroke="#627571" stroke-width="1.5"/><text x="894" y="273.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">The group</text><text x="894" y="291.3333333333333" font-size="13" fill="#203331" font-weight="400" text-anchor="middle">dissolves</text><text x="25" y="360" font-size="15" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Ordinary work groups stop at performing. Project teams also adjourn, because the project ends.</text><text x="25" y="385" font-size="15" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Real teams loop back: a new member, a lost sponsor or a crisis can return a performing team to storming.</text></svg>
