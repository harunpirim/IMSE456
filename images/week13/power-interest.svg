<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc" style="width:100%;height:620px;font-family:Arial,sans-serif">
<title id="title">Power/interest grid for the conference</title><desc id="desc">Twelve conference stakeholders plotted by interest (horizontal) and power (vertical), split at 2.5 into four quadrants: manage closely, keep satisfied, keep informed, monitor.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="620" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Power and interest decide how much attention a stakeholder gets</text><rect x="454.0" y="70" width="486.0" height="294.0" rx="0" fill="#E9F3EF" stroke="none" stroke-width="0"/><rect x="130" y="70" width="324.0" height="294.0" rx="0" fill="#F5F7F7" stroke="none" stroke-width="0"/><rect x="454.0" y="364.0" width="486.0" height="196.0" rx="0" fill="#F4F7F6" stroke="none" stroke-width="0"/><path d="M130,560 L940,560" fill="none" stroke="#203331" stroke-width="2"/><path d="M130,560 L130,70" fill="none" stroke="#203331" stroke-width="2"/><path d="M454.0,560 L454.0,70" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="6,5"/><path d="M130,364.0 L940,364.0" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="6,5"/><text x="211.0" y="582" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">1</text><text x="118" y="516.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">1</text><text x="373.0" y="582" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">2</text><text x="118" y="418.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">2</text><text x="535.0" y="582" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">3</text><text x="118" y="320.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">3</text><text x="697.0" y="582" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">4</text><text x="118" y="222.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">4</text><text x="859.0" y="582" font-size="14" fill="#627571" font-weight="400" text-anchor="middle">5</text><text x="118" y="124.0" font-size="14" fill="#627571" font-weight="400" text-anchor="end">5</text><text x="535.0" y="608" font-size="16" fill="#203331" font-weight="700" text-anchor="middle">Interest in the project (1–5)</text><text x="62" y="315.0" font-size="16" fill="#203331" font-weight="700" text-anchor="middle" transform="rotate(-90 62 315.0)">Power over the project (1–5)</text><text x="142" y="94" font-size="18" fill="#0F5A4B" font-weight="700" text-anchor="start">Keep satisfied</text><text x="928" y="94" font-size="18" fill="#0F5A4B" font-weight="700" text-anchor="end">Manage closely</text><text x="142" y="546" font-size="18" fill="#0F5A4B" font-weight="700" text-anchor="start">Monitor</text><text x="928" y="546" font-size="18" fill="#0F5A4B" font-weight="700" text-anchor="end">Keep informed</text><circle cx="859.0" cy="119.0" r="7" fill="#0F5A4B" stroke="#fff" stroke-width="2"/><text x="871.0" y="124.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Sponsor</text><circle cx="859.0" cy="315.0" r="7" fill="#0F5A4B" stroke="#fff" stroke-width="2"/><text x="871.0" y="320.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Program chair</text><circle cx="697.0" cy="315.0" r="7" fill="#0F5A4B" stroke="#fff" stroke-width="2"/><text x="709.0" y="320.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">App development firm</text><circle cx="535.0" cy="217.0" r="7" fill="#0F5A4B" stroke="#fff" stroke-width="2"/><text x="547.0" y="222.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Venue sales manager</text><circle cx="373.0" cy="217.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="385.0" y="222.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">IT director</text><circle cx="373.0" cy="217.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="361.0" y="222.0" font-size="13" fill="#203331" font-weight="400" text-anchor="end">Marketing VP</text><circle cx="211.0" cy="119.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="223.0" y="124.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Fire marshal</text><circle cx="211.0" cy="315.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="223.0" y="320.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Finance office</text><circle cx="859.0" cy="413.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="871.0" y="418.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Attendees</text><circle cx="697.0" cy="413.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="709.0" y="418.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Keynote speakers</text><circle cx="535.0" cy="413.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="547.0" y="418.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Campus AV services</text><circle cx="373.0" cy="413.0" r="7" fill="#627571" stroke="#fff" stroke-width="2"/><text x="385.0" y="418.0" font-size="13" fill="#203331" font-weight="400" text-anchor="start">Caterer</text></svg>
