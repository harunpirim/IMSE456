<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" style="width:100%;height:470px;font-family:Arial,sans-serif">
<title id="title">Technical and resource constraints</title><desc id="desc">Four wedding tasks. With technical constraints only, three run in parallel between Plan and Reception. With one person, the same tasks run in series.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="470" fill="#fff"/><text x="25" y="36" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="start">A resource constraint changes the sequence, not the logic</text><text x="40" y="80" font-size="16" fill="#627571" font-weight="700" text-anchor="start">A · Technical constraints only: three tasks can run in parallel</text><ellipse cx="150" cy="170" rx="55.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="150" y="176" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Plan</text><ellipse cx="470" cy="110" rx="95.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="470" y="116" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Purchase refreshments</text><path d="M205,170 L375,110" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M565,110 L738,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><ellipse cx="470" cy="170" rx="95.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="470" y="176" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Decorate hall</text><path d="M205,170 L375,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M565,170 L738,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><ellipse cx="470" cy="230" rx="95.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="470" y="236" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Hire band</text><path d="M205,170 L375,230" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M565,230 L738,170" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><ellipse cx="820" cy="170" rx="75.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="820" y="176" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Reception</text><text x="40" y="300" font-size="16" fill="#627571" font-weight="700" text-anchor="start">B · One person must do all three: the same logic, forced into series</text><ellipse cx="110" cy="380" rx="75.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="110" y="386" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Plan</text><ellipse cx="300" cy="380" rx="75.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="300" y="386" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Hire band</text><ellipse cx="500" cy="380" rx="75.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="500" y="386" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Decorate hall</text><ellipse cx="700" cy="380" rx="95.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="700" y="386" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Purchase refreshments</text><ellipse cx="890" cy="380" rx="75.0" ry="26" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="890" y="386" font-size="15" fill="#203331" font-weight="700" text-anchor="middle">Reception</text><path d="M187,380 L221,380" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M377,380 L421,380" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M577,380 L601,380" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><path d="M797,380 L811,380" fill="none" stroke="#0F5A4B" stroke-width="2.5" marker-end="url(#g)"/><text x="40" y="440" font-size="15" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Resource dependency takes priority over the technical dependency but never violates it: all three still finish before the reception.</text></svg>
