<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc" style="width:100%;height:700px;font-family:Arial,sans-serif">
<title id="title">Heuristic versus optimal schedule with two coordinators</title><desc id="desc">Two Gantt charts. The minimum-slack heuristic delays B behind C and finishes on day 39. The optimum starts B first and finishes on day 35, four days earlier.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="700" fill="#fff"/><text x="25" y="36" font-size="22" fill="#0F5A4B" font-weight="700" text-anchor="start">Two coordinators: the minimum-slack rule finishes on day 39, the best schedule on day 35</text><text x="40" y="70" font-size="17" fill="#0F5A4B" font-weight="700" text-anchor="start">Parallel method, priority to minimum slack: C (slack 0) starts before B (slack 5), so B waits for C</text><text x="100" y="101" font-size="14" fill="#203331" font-weight="700" text-anchor="end">A</text><rect x="110" y="87" width="40" height="18" rx="3" fill="#8FB8AD"/><text x="130.0" y="101" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="125" font-size="14" fill="#203331" font-weight="700" text-anchor="end">C</text><rect x="152" y="111" width="124" height="18" rx="3" fill="#8FB8AD"/><text x="214.0" y="125" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="149" font-size="14" fill="#203331" font-weight="700" text-anchor="end">B</text><rect x="278" y="135" width="103" height="18" rx="3" fill="#627571"/><text x="329.5" y="149" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="173" font-size="14" fill="#203331" font-weight="700" text-anchor="end">E</text><rect x="383" y="159" width="166" height="18" rx="3" fill="#627571"/><text x="466.0" y="173" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="197" font-size="14" fill="#203331" font-weight="700" text-anchor="end">D</text><rect x="551" y="183" width="82" height="18" rx="3" fill="#8FB8AD"/><text x="592.0" y="197" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="221" font-size="14" fill="#203331" font-weight="700" text-anchor="end">F</text><rect x="635" y="207" width="103" height="18" rx="3" fill="#627571"/><text x="686.5" y="221" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="245" font-size="14" fill="#203331" font-weight="700" text-anchor="end">G</text><rect x="740" y="231" width="61" height="18" rx="3" fill="#8FB8AD"/><text x="770.5" y="245" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="269" font-size="14" fill="#203331" font-weight="700" text-anchor="end">H</text><rect x="803" y="255" width="82" height="18" rx="3" fill="#627571"/><text x="844.0" y="269" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="293" font-size="14" fill="#203331" font-weight="700" text-anchor="end">I</text><rect x="887" y="279" width="40" height="18" rx="3" fill="#627571"/><text x="907.0" y="293" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M110,306 L950,306" fill="none" stroke="#203331" stroke-width="1.5"/><text x="110" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">0</text><text x="215" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">5</text><text x="320" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">10</text><text x="425" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">15</text><text x="530" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">20</text><text x="635" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">25</text><text x="740" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">30</text><text x="845" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">35</text><text x="950" y="322" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">40</text><path d="M635,82 L635,306" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="5,4"/><text x="629" y="94" font-size="12" fill="#627571" font-weight="400" text-anchor="end">CPM, day 25</text><path d="M929,80 L929,306" fill="none" stroke="#B5543A" stroke-width="2"/><text x="935" y="94" font-size="14" fill="#B5543A" font-weight="700" text-anchor="start">day 39</text><text x="40" y="390" font-size="17" fill="#0F5A4B" font-weight="700" text-anchor="start">Optimum, found by trying every precedence-feasible order: B first, because it needs both coordinators</text><text x="100" y="421" font-size="14" fill="#203331" font-weight="700" text-anchor="end">A</text><rect x="110" y="407" width="40" height="18" rx="3" fill="#8FB8AD"/><text x="130.0" y="421" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="445" font-size="14" fill="#203331" font-weight="700" text-anchor="end">B</text><rect x="152" y="431" width="103" height="18" rx="3" fill="#0F5A4B"/><text x="203.5" y="445" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="469" font-size="14" fill="#203331" font-weight="700" text-anchor="end">C</text><rect x="257" y="455" width="124" height="18" rx="3" fill="#8FB8AD"/><text x="319.0" y="469" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="493" font-size="14" fill="#203331" font-weight="700" text-anchor="end">D</text><rect x="257" y="479" width="82" height="18" rx="3" fill="#8FB8AD"/><text x="298.0" y="493" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="517" font-size="14" fill="#203331" font-weight="700" text-anchor="end">E</text><rect x="383" y="503" width="166" height="18" rx="3" fill="#0F5A4B"/><text x="466.0" y="517" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="541" font-size="14" fill="#203331" font-weight="700" text-anchor="end">F</text><rect x="551" y="527" width="103" height="18" rx="3" fill="#0F5A4B"/><text x="602.5" y="541" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="565" font-size="14" fill="#203331" font-weight="700" text-anchor="end">G</text><rect x="656" y="551" width="61" height="18" rx="3" fill="#8FB8AD"/><text x="686.5" y="565" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="589" font-size="14" fill="#203331" font-weight="700" text-anchor="end">H</text><rect x="719" y="575" width="82" height="18" rx="3" fill="#0F5A4B"/><text x="760.0" y="589" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="613" font-size="14" fill="#203331" font-weight="700" text-anchor="end">I</text><rect x="803" y="599" width="40" height="18" rx="3" fill="#0F5A4B"/><text x="823.0" y="613" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M110,626 L950,626" fill="none" stroke="#203331" stroke-width="1.5"/><text x="110" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">0</text><text x="215" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">5</text><text x="320" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">10</text><text x="425" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">15</text><text x="530" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">20</text><text x="635" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">25</text><text x="740" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">30</text><text x="845" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">35</text><text x="950" y="642" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">40</text><path d="M635,402 L635,626" fill="none" stroke="#627571" stroke-width="1.5" stroke-dasharray="5,4"/><text x="629" y="414" font-size="12" fill="#627571" font-weight="400" text-anchor="end">CPM, day 25</text><path d="M845,400 L845,626" fill="none" stroke="#B5543A" stroke-width="2"/><text x="851" y="414" font-size="14" fill="#B5543A" font-weight="700" text-anchor="start">day 35</text><text x="40" y="688" font-size="13" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">The number on each bar is the coordinators it uses. Both schedules respect every predecessor and never exceed two people.</text></svg>
