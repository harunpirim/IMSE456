<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc" style="width:100%;height:330px;font-family:Arial,sans-serif">
<title id="title">The project planning process</title><desc id="desc">Scope and WBS lead to the project network, then to resource and cost scheduling, then to the master plan, with risk management feeding every step.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
<rect width="1000" height="330" fill="#fff"/><text x="25" y="36" font-size="23" fill="#0F5A4B" font-weight="700" text-anchor="start">Resource and cost scheduling turns the network into the master plan</text><rect x="60" y="90" width="180" height="70" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="150" y="131" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Scope and WBS</text><path d="M242,125 L296,125" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="300" y="90" width="180" height="70" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="390" y="131" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Project network</text><path d="M482,125 L536,125" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="540" y="90" width="180" height="70" rx="8" fill="#E9F3EF" stroke="#0F5A4B" stroke-width="2"/><text x="630" y="120" font-size="17" fill="#0F5A4B" font-weight="700" text-anchor="middle">Resource and</text><text x="630" y="142" font-size="17" fill="#0F5A4B" font-weight="700" text-anchor="middle">cost scheduling</text><path d="M722,125 L796,125" fill="none" stroke="#0F5A4B" stroke-width="3" marker-end="url(#g)"/><rect x="800" y="90" width="150" height="70" rx="8" fill="#F5F7F7" stroke="#627571" stroke-width="2"/><text x="875" y="131" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Master plan</text><rect x="400" y="230" width="200" height="60" rx="8" fill="#fff" stroke="#627571" stroke-width="2"/><text x="500" y="266" font-size="17" fill="#203331" font-weight="700" text-anchor="middle">Risk management</text><path d="M500,230 L150,164" fill="none" stroke="#627571" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#k)"/><path d="M500,230 L390,164" fill="none" stroke="#627571" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#k)"/><path d="M500,230 L630,164" fill="none" stroke="#627571" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#k)"/><path d="M500,230 L875,164" fill="none" stroke="#627571" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#k)"/><text x="25" y="315" font-size="15" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">Week 4 produced the scope, Week 6 the network, Week 7 the risks. This week assigns people and money to the dates.</text></svg>
