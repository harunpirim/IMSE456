ont-size="12" fill="#627571" font-weight="400" text-anchor="middle">23k</text><rect x="190" y="396.42857142857144" width="50" height="23.571428571428573" fill="#E0E7E4" stroke="#627571" stroke-width="1"/><text x="185" y="440" font-size="13" fill="#203331" font-weight="700" text-anchor="middle">Week 1</text><rect x="280" y="302.1428571428571" width="50" height="117.85714285714286" fill="#8FB8AD"/><text x="305" y="296.1428571428571" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">25k</text><rect x="340" y="306.8571428571429" width="50" height="113.14285714285714" fill="#E0E7E4" stroke="#627571" stroke-width="1"/><text x="335" y="440" font-size="13" fill="#203331" font-weight="700" text-anchor="middle">Week 2</text><rect x="430" y="368.14285714285717" width="50" height="51.857142857142854" fill="#8FB8AD"/><text x="455" y="362.14285714285717" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">11k</text><rect x="490" y="297.42857142857144" width="50" height="122.57142857142857" fill="#E0E7E4" stroke="#627571" stroke-width="1"/><text x="485" y="440" font-size="13" fill="#203331" font-weight="700" text-anchor="middle">Week 3</text><rect x="580" y="394.07142857142856" width="50" height="25.928571428571427" fill="#8FB8AD"/><text x="605" y="388.07142857142856" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">5.5k</text><rect x="640" y="375.2142857142857" width="50" height="44.785714285714285" fill="#E0E7E4" stroke="#627571" stroke-width="1"/><text x="635" y="440" font-size="13" fill="#203331" font-weight="700" text-anchor="middle">Week 4</text><rect x="730" y="394.07142857142856" width="50" height="25.928571428571427" fill="#8FB8AD"/><text x="755" y="388.07142857142856" font-size="12" fill="#627571" font-weight="400" text-anchor="middle">5.5k</text><rect x="790" y="394.07142857142856" width="50" height="25.928571428571427" fill="#E0E7E4" stroke="#627571" stroke-width="1"/><text x="785" y="440" font-size="13" fill="#203331" font-weight="700" text-anchor="middle">Week 5</text><path d="M110,420 L260,311.57142857142856 410,193.71428571428572 560,141.85714285714283 710,115.92857142857144 860,90.0" fill="none" stroke="#0F5A4B" stroke-width="3"/><path d="M110,420 L260,396.42857142857144 410,283.2857142857143 560,160.71428571428572 710,115.92857142857144 860,90.0" fill="none" stroke="#627571" stroke-width="2.5" stroke-dasharray="7,5"/><circle cx="260" cy="311.57142857142856" r="4" fill="#0F5A4B"/><circle cx="410" cy="193.71428571428572" r="4" fill="#0F5A4B"/><circle cx="560" cy="141.85714285714283" r="4" fill="#0F5A4B"/><circle cx="710" cy="115.92857142857144" r="4" fill="#0F5A4B"/><circle cx="860" cy="90.0" r="4" fill="#0F5A4B"/><text x="870" y="95.0" font-size="13" fill="#0F5A4B" font-weight="700" text-anchor="start">$70,000</text><text x="420" y="179.71428571428572" font-size="14" fill="#0F5A4B" font-weight="700" text-anchor="start">cumulative, early-start baseline</text><text x="570" y="186.71428571428572" font-size="14" fill="#627571" font-weight="700" text-anchor="start" font-style="italic">cumulative, late start</text><rect x="110" y="470" width="14" height="14" fill="#8FB8AD"/><text x="132" y="482" font-size="13" fill="#627571" font-weight="400" text-anchor="start">weekly spend, early start</text><rect x="340" y="470" width="14" height="14" fill="#E0E7E4" stroke="#627571"/><text x="362" y="482" font-size="13" fill="#627571" font-weight="400" text-anchor="start">weekly spend, late start</text><text x="580" y="482" font-size="13" fill="#627571" font-weight="400" text-anchor="start" font-style="italic">End of week 2: early start expects $48,000 spent, late start $29,000.</text></svg>
