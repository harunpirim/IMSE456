<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc" style="width:100%;height:520px;font-family:Arial,sans-serif">
<title id="title">Time-phased budget baseline for the conference</title><desc id="desc">Weekly bars and cumulative curves for the early-start and late-start schedules. Both reach $70,000 in week 5, but the early-start baseline has spent $48,000 by the end of week 2 and the late-start plan $29,000.</desc>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0F5A4B"/></marker><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627571"/></marker></defs>
